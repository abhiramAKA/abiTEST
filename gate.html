<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>КХАМАЧ — Чертоги Испытаний</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="game-interface">
        
        <!-- ГОТИЧЕСКОЕ ОКНО С КОРИЧНЕВОЙ РАМКОЙ -->
        <div id="onboarding-gothic-window" class="game-window" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 380px; box-sizing: border-box;">
            <h1 id="onboarding-title" style="font-size: 28px; margin-bottom: 5px;">ПРИКЛЮЧЕНИЕ</h1>
            <span id="onboarding-subtitle" class="subtitle" style="margin-bottom: 20px; font-size: 12px; text-transform: uppercase; letter-spacing: 2px;">Первый шаг in Горнило</span>
            
            <p id="onboarding-description" style="font-size: 13px; line-height: 1.6; color: #bfae96; margin-bottom: 25px; padding: 0 10px;">
                Древние подземелья Абхирамбурга пробудились. Соберите волю в кулак, управляйте камнями стихий и сокрушите огнедышащих тварей в тактических битвах!
            </p>

            <!-- ДИНАМИЧЕСКИЙ КОНТЕЙНЕР ДЛЯ КВАДРАТНЫХ КНОПОК -->
            <div id="onboarding-buttons-zone" class="menu-emoji-grid" style="display: flex; justify-content: center; align-items: center; gap: 16px; min-height: 140px; width: 100%; box-sizing: border-box; padding: 0 20px;">
                <!-- Кнопки создаются автоматически скриптом onboarding-engine.js -->
            </div>
        </div>
        
        <!-- ТЕХНИЧЕСКИЕ СЛОТЫ ДЛЯ СБОРКИ ИГРОВЫХ МОДУЛЕЙ -->
        <div id="main-menu" style="display: none;"></div>
        <div id="dynamic-combat-screen"></div>
        <div id="squad-heroes-spec-screen" class="game-window" style="display: none; z-index: 100;"></div>
        
        <!-- НАСТОЯЩИЙ СЛОТ ДЛЯ ИНЪЕКЦИИ ДОСКИ ПОРУЧЕНИЙ -->
        <div id="missions-screen" class="game-window" style="display: none; z-index: 100; flex-direction: column;">
            <h2>Доска Поручений</h2>
            <span class="subtitle">Городские Контракты</span>
            <div id="missions-list-container" style="display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; margin-bottom: 10px;"></div>
            <button id="close-missions-btn" class="menu-btn back-btn" style="width: 100%; display: none;">Назад в меню</button>
        </div>

        <div id="dynamic-town-screens" style="display: none;"></div>
    </div>

    <!-- Подключаем выделенный вычислительный модуль онбординга -->
    <script src="onboarding-engine.js?v=v5.7.36-FIX"></script>
</body>
</html>
