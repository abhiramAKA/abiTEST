<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>КХАМАЧ — Режим Отладки Боя</title>
    <script>
        (function() {
            window.GAME_VERSION = "v5.7.7-DEBUG";
            const enforceBuster = Date.now() + '_' + Math.floor(Math.random() * 999999);
            
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'styles.css?t=' + enforceBuster;
            document.head.appendChild(link);

            const scripts = [
                'game.js', 'background.js', 'audio-engine.js', 'match3-fx.js',
                'match3-input.js', 'match3.js', 'match3-logic.js', 'match3-data.js',
                'campaign.js', 'town-engine.js', 'town-chronicle.js',
                'missions-pool.js', 'missions-engine.js', 'town-dom.js',
                'squad-dom.js', 'combat-popups.js', 'combat-dom.js', 'missions-board.js',
                'squad-logic.js', 'squad-core.js', 'combat-actions.js', 
                'combat.js', 'game-listeners.js'
            ];

            function injectScript(index) {
                if (index >= scripts.length) {
                    if (typeof initDispatcherModule === 'function') initDispatcherModule();
                    
                    // Безопасный форсированный запуск боевой сессии
                    if (typeof showScreen === 'function' && typeof startCombatSession === 'function') {
                        showScreen('combat-screen');
                        startCombatSession(1); 
                    }
                    return;
                }
                const script = document.createElement('script');
                script.src = scripts[index] + '?v=' + window.GAME_VERSION + '&t=' + enforceBuster;
                script.async = false; 
                script.onload = function() { injectScript(index + 1); };
                document.head.appendChild(script);
            }

            document.addEventListener("DOMContentLoaded", function() {
                injectScript(0);
            });
        })();
    </script>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="game-interface">
        <div id="main-menu" class="game-window" style="display: none; max-width: 380px;"></div>
        <div id="dragon-select-screen" class="game-window" style="display: none;"></div>
        <div id="dynamic-combat-screen"></div>
        <div id="info-screen" class="game-window" style="display: none;"></div>
        <div id="mode-desc-screen" class="game-window" style="display: none;"></div>
    </div>
</body>
</html>
