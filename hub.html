<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>КХАМАЧ — Легенды Абхирамбурга</title>
    <script>
        (function() {
            window.GAME_VERSION = "v5.4.1-BETA";
            if (localStorage.getItem('khamach_sys_version') !== window.GAME_VERSION) {
                localStorage.setItem('khamach_sys_version', window.GAME_VERSION);
            }
            const buster = Date.now() + '_' + Math.floor(Math.random() * 99999);
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'styles.css?t=' + buster;
            document.head.appendChild(link);

            const scripts = [
                'game.js', 
                'background.js', 
                'audio-engine.js', 
                'match3-data.js', 
                'missions-pool.js',
                'squad-history.js',
                'town-engine.js',
                'missions-core.js', 
                'squad-logic.js',
                'match3-fx.js',
                'match3-input.js', 
                'match3.js', 
                'match3-logic.js',
                'campaign.js', 
                'town-dom.js',
                'squad-dom.js', 
                'combat-dom.js', 
                'missions-board.js',
                'squad-core.js', 
                'combat.js', 
                'game-listeners.js'
            ];

            function injectScript(idx) {
                if (idx >= scripts.length) {
                    console.log("КХАМАЧ: Все архитектурные модули успешно инициализированы.");
                    if (typeof initDispatcherModule === 'function') {
                        initDispatcherModule();
                    }
                    const done = localStorage.getItem('khamach_combat_tutorial_done') === 'true';
                    if (!done) {
                        ['to-squad-btn', 'to-storage-btn', 'to-chronicle-btn', 'to-clans-btn'].forEach(id => {
                            const b = document.getElementById(id); if (b) b.classList.add('progression-locked');
                        });
                    }
                    return;
                }
                const s = document.createElement('script');
                s.src = scripts[idx] + '?v=' + window.GAME_VERSION + '&t=' + buster;
                s.async = false;
                s.onload = function() { injectScript(idx + 1); };
                document.head.appendChild(s);
            }
            document.addEventListener("DOMContentLoaded", function() { injectScript(0); });
        })();
    </script>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="game-interface">
        <!-- ================= ГЛАВНОЕ МЕНЮ ИГРЫ ================= -->
        <div id="main-menu" class="game-window" style="display: flex;">
            <!-- Шапка ресурсов -->
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 2px; padding: 0 4px; background: rgba(20, 15, 12, 0.5); border-bottom: 1px double #544432; box-sizing: border-box;">
                <span id="main-gold-display" class="gold-counter-display" style="color: #ffd700; cursor: pointer; font-size: 14px; font-weight: bold;">🪙 0</span>
                <h1 style="font-size: 24px; margin: 0; letter-spacing: 2px; padding: 4px 0;">КХАМАЧ</h1>
                <span id="team-fatigue-display" style="color: #ffb3ba; cursor: pointer; font-size: 14px; font-weight: bold;">🥱 0%</span>
            </div>
            <span class="subtitle" style="font-size: 11px; margin-bottom: 10px; padding-bottom: 4px; letter-spacing: 1px;">Легенды Абхирамбурга</span>
            
            <!-- ОТЛАДОЧНЫЙ UX-РЯД: СТРОГАЯ ВЕРТИКАЛЬНАЯ СТРУКТУРА КНОПОК -->
            <div style="display: flex; flex-direction: column; width: 100%; gap: 6px; box-sizing: border-box; margin-bottom: 10px;">
                <div style="display: flex; gap: 6px; width: 100%;">
                    <button id="to-combat-btn" class="menu-btn" style="flex: 2; padding: 12px; background: linear-gradient(to bottom, #421e1e 0%, #241010 100%); border-color: #6e3131; color: #ff8c8c;">🌋 В БОЙ!</button>
                    <button id="to-settings-btn" class="info-btn" style="flex: 1; height: auto; font-size: 13px;">⚙️ Настройки</button>
                    <button id="info-btn" class="info-btn" style="flex: 1; height: auto; font-size: 13px;">❓ Справка</button>
                </div>
                <button id="to-missions-btn" class="menu-btn" style="padding: 12px;">💰 Городские Поручения</button>
                <button id="to-squad-btn" class="menu-btn" style="padding: 12px;">🏰 Цитадель и Здания</button>
                <button id="to-storage-btn" class="menu-btn" style="padding: 12px;">🏋️ Военный Лагерь (Герои)</button>
                <button id="to-chronicle-btn" class="menu-btn" style="padding: 12px;">📜 Летопись Подвигов</button>
                <button id="to-clans-btn" class="menu-btn" style="padding: 12px;">👥 Орден Кхамача (Кланы)</button>
            </div>
        </div>

        <!-- Контейнеры экранов -->
        <div id="dynamic-town-screens" style="display: none;"></div>
        <div id="squad-screen" class="game-window" style="display: none;"></div>
        <div id="dynamic-combat-screen" style="display: none;"></div>
    </div>
</body>
</html>
